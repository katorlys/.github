name: Bugs
description: Found a bug? Report it here.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        ### Guidelines
        Please read the [Contributing Guidelines](https://katorly.com/docs/contribute/contributing) and [Code of Conduct](https://katorly.com/docs/contribute/code-of-conduct) before opening an issue.
        If you want to report a security vulnerability, please review our [Security Policy](https://katorly.com/docs/contribute/security) first.
  - type: textarea
    attributes:
      label: Describe the bug
      description: |
        Provide a clear and concise description of the bug. If applicable, add screenshots or screen recordings.
        You can include any build, compile, or console errors you encountered. Please copy the full error message.
        For large blocks of text, please use https://gist.github.com or https://pastebin.com.
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system and its version
      placeholder: "Type 'none' if there isn't any."
    validations:
      required: true
  - type: input
    attributes:
      label: Programming language and its version
      placeholder: "Type 'none' if there isn't any."
    validations:
      required: true
  - type: input
    attributes:
      label: Dependencies and their versions
      placeholder: "Type 'none' if there isn't any."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: |
        Tell us how to reproduce this issue.
        If applicable, add screenshots to explain the steps.
      value: "1. "
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: |
        Tell us what you expected to happen.
        If applicable, add screenshots to provide context.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behavior
      description: |
        Tell us what happened instead.
        If applicable, add screenshots to provide context.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Other
      description: |
        Add anything else that might help us understand the issue.
        You can also share any related context or feedback here.
    validations:
      required: false
      
