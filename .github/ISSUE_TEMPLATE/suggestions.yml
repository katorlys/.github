name: Suggestions
description: Have an idea or feature request? Share it here.
title: "[Suggest] "
body:
  - type: markdown
    attributes:
      value: |
        ### Guidelines
        Please read the [Contributing Guidelines](https://katorly.com/docs/contribute/contributing) and [Code of Conduct](https://katorly.com/docs/contribute/code-of-conduct) before opening an issue.
        If you want to report a security vulnerability, please review our [Security Policy](https://katorly.com/docs/contribute/security) first.
  - type: textarea
    attributes:
      label: Suggestion
      description: |
        Describe your suggestion here. Please be as clear and specific as possible.
        If you want to help implement it, feel free to open a pull request in the relevant repository.
        If applicable, add screenshots or mockups to explain your idea.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reason
      description: Tell us why you think this would be useful.
      placeholder: "I'm suggesting this because..."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Other
      description: |
        Add anything else that might help us understand your suggestion.
        You can also share any related context or feedback here.
    validations:
      required: false
      
